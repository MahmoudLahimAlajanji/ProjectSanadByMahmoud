$kind: http-request
url: "{{base}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Sara",
      "lastName": "Hasan",
      "email": "u{{$timestamp}}@test.com",
      "username": "u{{$timestamp}}",
      "password": "Pass@12345",
      "Phone": "0999123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("password not exposed", function () { pm.expect(JSON.stringify(json)).to.not.include('password'); });
      pm.test("default role YOUTH", function () { pm.expect(json.role).to.eql('YOUTH'); });
    language: text/javascript
order: 1000
