$kind: http-request
name: 17. Register duplicate email/username
url: "{{base}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Youth1",
      "lastName": "Test",
      "email": "youth1@test.com",
      "username": "youth1",
      "password": "Pass@12345",
      "Phone": "0999000001"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', function () { pm.expect(pm.response.code).to.be.oneOf([409]); });
    language: text/javascript
order: 2000
