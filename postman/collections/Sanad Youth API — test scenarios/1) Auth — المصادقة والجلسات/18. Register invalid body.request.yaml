$kind: http-request
description: "ValidationPipe: إيميل غلط، username قصير، password أقل من 8، أسماء فاضية."
url: "{{base}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "",
      "lastName": "",
      "email": "not-an-email",
      "username": "ab",
      "password": "123"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 3000
