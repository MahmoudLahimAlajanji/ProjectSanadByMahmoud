$kind: http-request
description: "forbidNonWhitelisted: ما حدا بيقدر يعمل نفسه أدمن."
url: "{{base}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Evil",
      "lastName": "User",
      "email": "evil@test.com",
      "username": "evil",
      "password": "Pass@12345",
      "role": "ADMIN"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 4000
