$kind: http-request
url: "{{base}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "A",
      "lastName": "B",
      "email": "badphone@test.com",
      "username": "badphone",
      "password": "Pass@12345",
      "Phone": "123"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 5000
