$kind: http-request
url: "{{base}}/auth/profile"
method: GET
headers:
  Authorization: Bearer {{tmp_access}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("no password in profile", function () { pm.expect(json).to.not.have.property('password'); });
    language: text/javascript
order: 10000
