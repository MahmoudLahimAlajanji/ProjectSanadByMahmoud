$kind: http-request
description: بيرجع tokens جديدة، والـ refresh القديم بينحرق.
url: "{{base}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{tmp_refresh}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('old_refresh', pm.collectionVariables.get('tmp_refresh'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      if (pm.response.code < 300) pm.collectionVariables.set('tmp_access', json.access_token);
      if (pm.response.code < 300) pm.collectionVariables.set('tmp_refresh', json.refresh_token);
    language: text/javascript
order: 12000
