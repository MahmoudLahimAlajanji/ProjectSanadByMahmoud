$kind: http-request
description: إعادة استخدام refresh قديم = احتمال سرقة، فالجلسة كلها بتنلغي.
url: "{{base}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{old_refresh}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', function () { pm.expect(pm.response.code).to.be.oneOf([401]); });
    language: text/javascript
order: 13000
