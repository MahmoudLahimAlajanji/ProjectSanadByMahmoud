$kind: http-request
description: الـ access موقّع بسر مختلف.
url: "{{base}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{y1_token}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', function () { pm.expect(pm.response.code).to.be.oneOf([401]); });
    language: text/javascript
order: 15000
