$kind: http-request
url: "{{base}}/users?role=SUPERVISOR&page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
queryParams:
  role: SUPERVISOR
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("has data + meta", function () { pm.expect(json.data).to.be.an('array'); pm.expect(json.meta).to.have.property('totalPages'); });
      pm.test("no passwords", function () { pm.expect(JSON.stringify(json)).to.not.include('password'); });
    language: text/javascript
order: 1000
