$kind: http-request
name: "42. Update my profile: try role"
url: "{{base}}/users/me"
method: PATCH
headers:
  Authorization: Bearer {{y1_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "ADMIN"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 8000
