$kind: http-request
description: هاد البرنامج (2 مقاعد) بنستخدمه بكل سيناريوهات التقديم.
url: "{{base}}/programs"
method: POST
headers:
  Authorization: Bearer {{sup1_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Backend with NestJS",
      "description": "Hands-on backend training program",
      "seats": 2,
      "startsAt": "2027-01-10T09:00:00.000Z",
      "endsAt": "2027-01-10T12:00:00.000Z",
      "location": "Damascus - Hall 2"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      if (pm.response.code < 300) pm.collectionVariables.set('programId', json.id);
      pm.test("seatsLeft = seats = 2", function () { pm.expect(json.seatsLeft).to.eql(2); });
    language: text/javascript
order: 1000
