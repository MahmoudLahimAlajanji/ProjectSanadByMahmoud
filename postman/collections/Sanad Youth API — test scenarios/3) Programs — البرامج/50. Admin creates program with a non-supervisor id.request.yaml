$kind: http-request
description: الـ id هاد لشاب مو مشرف.
url: "{{base}}/programs"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Backend with NestJS",
      "description": "Hands-on backend training program",
      "seats": 2,
      "startsAt": "2027-01-10T09:00:00.000Z",
      "endsAt": "2027-01-10T12:00:00.000Z",
      "location": "Damascus - Hall 2",
      "supervisorId": {{y1_id}}
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 8000
