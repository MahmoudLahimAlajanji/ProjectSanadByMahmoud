$kind: http-request
url: "{{base}}/programs"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Admin-created program",
      "description": "Hands-on backend training program",
      "seats": 10,
      "startsAt": "2027-01-10T09:00:00.000Z",
      "endsAt": "2027-01-10T12:00:00.000Z",
      "location": "Damascus - Hall 2",
      "supervisorId": {{sup1_id}}
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
    language: text/javascript
order: 9000
