$kind: http-request
name: "53. Upload image: wrong type (select a .txt file)"
url: "{{base}}/programs/{{programId}}/image"
method: POST
headers:
  Authorization: Bearer {{sup1_token}}
body:
  type: formdata
  content:
    - type: file
      key: image
      src: []
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 11000
