$kind: http-request
description: اختار صورة صحيحة. لازم يرجع 403 والملف ما ينحفظ.
url: "{{base}}/programs/{{programId}}/image"
method: POST
headers:
  Authorization: Bearer {{sup2_token}}
body:
  type: formdata
  content:
    - type: file
      key: image
      src: []
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', function () { pm.expect(pm.response.code).to.be.oneOf([403]); });
    language: text/javascript
order: 13000
