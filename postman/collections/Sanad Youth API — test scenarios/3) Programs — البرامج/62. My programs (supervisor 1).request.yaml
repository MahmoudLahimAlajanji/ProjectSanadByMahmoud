$kind: http-request
description: 'كان فيه باغ: المسار "mine" كان بعد ":id" فبيرجع 400. انصلح.'
url: "{{base}}/programs/mine?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{sup1_token}}
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("only own programs", function () { pm.expect(json.data.length).to.be.above(0); });
    language: text/javascript
order: 20000
