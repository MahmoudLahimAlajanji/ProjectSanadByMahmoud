$kind: http-request
url: "{{base}}/programs/mine"
method: GET
headers:
  Authorization: Bearer {{sup2_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("empty", function () { pm.expect(json.meta.total).to.eql(0); });
    language: text/javascript
order: 21000
