$kind: http-request
name: "69. Update: endsAt before startsAt"
description: التحقق بيتم على القيم المدموجة مع القديمة.
url: "{{base}}/programs/{{programId}}"
method: PATCH
headers:
  Authorization: Bearer {{sup1_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "endsAt": "2000-01-01T00:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 27000
