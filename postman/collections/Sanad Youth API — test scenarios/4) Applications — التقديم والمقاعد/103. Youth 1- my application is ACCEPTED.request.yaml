$kind: http-request
name: "103. Youth 1: my application is ACCEPTED"
url: "{{base}}/applications/my"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("ACCEPTED", function () { pm.expect(json.data.some(a => a.status === 'ACCEPTED')).to.be.true; });
    language: text/javascript
order: 33000
