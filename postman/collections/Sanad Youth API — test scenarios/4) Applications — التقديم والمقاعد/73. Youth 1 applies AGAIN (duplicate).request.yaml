$kind: http-request
description: ممنوع التقديم مرتين.
url: "{{base}}/applications"
method: POST
headers:
  Authorization: Bearer {{y1_token}}
body:
  type: urlencoded
  content:
    programId: "{{programId}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', function () { pm.expect(pm.response.code).to.be.oneOf([409]); });
    language: text/javascript
order: 3000
