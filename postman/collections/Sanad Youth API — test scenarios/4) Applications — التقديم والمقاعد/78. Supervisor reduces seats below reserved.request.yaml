$kind: http-request
description: ما بينفع ننقّص المقاعد عن المحجوز.
url: "{{base}}/programs/{{programId}}"
method: PATCH
headers:
  Authorization: Bearer {{sup1_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "seats": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', function () { pm.expect(pm.response.code).to.be.oneOf([409]); });
    language: text/javascript
order: 8000
