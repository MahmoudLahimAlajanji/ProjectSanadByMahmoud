$kind: http-request
url: "{{base}}/applications"
method: POST
headers:
  Authorization: Bearer {{y1_token}}
body:
  type: urlencoded
  content:
    programId: abc
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 10000
