$kind: http-request
url: "{{base}}/applications"
method: POST
headers:
  Authorization: Bearer {{sup1_token}}
body:
  type: urlencoded
  content:
    programId: "{{programId}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', function () { pm.expect(pm.response.code).to.be.oneOf([403]); });
    language: text/javascript
order: 11000
