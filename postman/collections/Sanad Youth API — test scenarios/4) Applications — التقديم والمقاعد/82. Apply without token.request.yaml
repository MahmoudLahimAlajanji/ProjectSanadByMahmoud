$kind: http-request
url: "{{base}}/applications"
method: POST
body:
  type: urlencoded
  content:
    programId: "{{programId}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', function () { pm.expect(pm.response.code).to.be.oneOf([401]); });
    language: text/javascript
order: 12000
