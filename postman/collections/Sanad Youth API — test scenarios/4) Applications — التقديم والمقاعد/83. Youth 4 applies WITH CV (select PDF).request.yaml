$kind: http-request
description: اختار ملف pdf/doc/docx أقل من 2MB. بيتخزن على القرص والـ DB فيها الاسم بس.
url: "{{base}}/applications"
method: POST
headers:
  Authorization: Bearer {{y4_token}}
body:
  type: formdata
  content:
    - type: text
      key: programId
      value: "{{program2Id}}"
    - type: file
      key: cv
      src: []
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      if (pm.response.code < 300) pm.collectionVariables.set('app4Id', json.id);
      pm.test("cvOriginalName saved", function () { pm.expect(json.cvOriginalName).to.be.a('string'); });
      pm.test("internal file name not exposed", function () { pm.expect(json).to.not.have.property('cvFile'); });
    language: text/javascript
order: 13000
