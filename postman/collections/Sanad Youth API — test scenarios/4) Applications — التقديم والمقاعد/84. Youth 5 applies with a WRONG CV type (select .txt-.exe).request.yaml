$kind: http-request
name: 84. Youth 5 applies with a WRONG CV type (select .txt/.exe)
url: "{{base}}/applications"
method: POST
headers:
  Authorization: Bearer {{y5_token}}
body:
  type: formdata
  content:
    - type: text
      key: programId
      value: "{{program2Id}}"
    - type: file
      key: cv
      src: []
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 14000
