$kind: http-request
name: "85. Youth 1: my applications"
url: "{{base}}/applications/my?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("PENDING shown", function () { pm.expect(json.data.some(a => a.status === 'PENDING')).to.be.true; });
      pm.test("only his own", function () { pm.expect(json.data.every(a => !a.user)).to.be.true; });
    language: text/javascript
order: 15000
