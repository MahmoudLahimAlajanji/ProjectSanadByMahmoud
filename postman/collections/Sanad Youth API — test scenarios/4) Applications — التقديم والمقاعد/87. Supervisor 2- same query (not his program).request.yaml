$kind: http-request
name: "87. Supervisor 2: same query (not his program)"
url: "{{base}}/applications?programId={{programId}}"
method: GET
headers:
  Authorization: Bearer {{sup2_token}}
queryParams:
  programId: "{{programId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("sees nothing", function () { pm.expect(json.meta.total).to.eql(0); });
    language: text/javascript
order: 17000
