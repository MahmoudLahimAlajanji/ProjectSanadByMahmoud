$kind: http-request
url: "{{base}}/applications/{{app2Id}}/decision"
method: PATCH
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "REJECTED"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 20000
