$kind: http-request
name: 93. GET program -> seatsLeft = 0 again
description: "الكاش بينبطل مع كل تغيير: لازم يظهر الرقم الجديد فورًا."
url: "{{base}}/programs/{{programId}}"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("seatsLeft is 0", function () { pm.expect(json.seatsLeft).to.eql(0); });
    language: text/javascript
order: 23000
