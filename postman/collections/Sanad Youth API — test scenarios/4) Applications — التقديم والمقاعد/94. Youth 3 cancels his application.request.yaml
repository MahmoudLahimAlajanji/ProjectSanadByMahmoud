$kind: http-request
url: "{{base}}/applications/{{app3Id}}/cancel"
method: PATCH
headers:
  Authorization: Bearer {{y3_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("CANCELLED", function () { pm.expect(json.status).to.eql('CANCELLED'); });
    language: text/javascript
order: 24000
