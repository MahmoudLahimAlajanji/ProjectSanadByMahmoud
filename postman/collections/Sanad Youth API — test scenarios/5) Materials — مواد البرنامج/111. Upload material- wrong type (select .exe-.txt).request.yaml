$kind: http-request
name: "111. Upload material: wrong type (select .exe/.txt)"
url: "{{base}}/programs/{{programId}}/materials"
method: POST
headers:
  Authorization: Bearer {{sup1_token}}
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Bad file
    - type: file
      key: file
      src: []
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 2000
