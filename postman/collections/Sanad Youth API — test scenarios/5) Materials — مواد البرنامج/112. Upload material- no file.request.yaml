$kind: http-request
name: "112. Upload material: no file"
url: "{{base}}/programs/{{programId}}/materials"
method: POST
headers:
  Authorization: Bearer {{sup1_token}}
body:
  type: formdata
  content:
    - type: text
      key: title
      value: No file
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 3000
