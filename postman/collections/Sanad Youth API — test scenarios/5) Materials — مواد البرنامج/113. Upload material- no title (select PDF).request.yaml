$kind: http-request
name: "113. Upload material: no title (select PDF)"
url: "{{base}}/programs/{{programId}}/materials"
method: POST
headers:
  Authorization: Bearer {{sup1_token}}
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', function () { pm.expect(pm.response.code).to.be.oneOf([400]); });
    language: text/javascript
order: 4000
