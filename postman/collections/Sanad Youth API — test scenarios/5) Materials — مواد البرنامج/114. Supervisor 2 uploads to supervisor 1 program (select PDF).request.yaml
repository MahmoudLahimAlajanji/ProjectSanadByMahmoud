$kind: http-request
url: "{{base}}/programs/{{programId}}/materials"
method: POST
headers:
  Authorization: Bearer {{sup2_token}}
body:
  type: formdata
  content:
    - type: text
      key: title
      value: x
    - type: file
      key: file
      src: []
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', function () { pm.expect(pm.response.code).to.be.oneOf([403]); });
    language: text/javascript
order: 5000
