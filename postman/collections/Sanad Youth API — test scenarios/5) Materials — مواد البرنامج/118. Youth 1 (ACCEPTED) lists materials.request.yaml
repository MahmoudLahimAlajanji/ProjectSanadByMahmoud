$kind: http-request
url: "{{base}}/programs/{{programId}}/materials"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("has 1+, no fileName", function () { pm.expect(json.length).to.be.above(0); pm.expect(JSON.stringify(json)).to.not.include('fileName'); });
    language: text/javascript
order: 9000
