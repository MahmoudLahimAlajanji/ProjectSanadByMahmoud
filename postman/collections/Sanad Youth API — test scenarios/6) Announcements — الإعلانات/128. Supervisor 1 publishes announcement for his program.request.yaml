$kind: http-request
url: "{{base}}/announcements"
method: POST
headers:
  Authorization: Bearer {{sup1_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Room changed",
      "content": "The session moved to Hall 3",
      "programId": {{programId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      if (pm.response.code < 300) pm.collectionVariables.set('annProgId', json.id);
    language: text/javascript
order: 3000
