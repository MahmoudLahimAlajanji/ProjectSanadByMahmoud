$kind: http-request
url: "{{base}}/announcements"
method: POST
headers:
  Authorization: Bearer {{y1_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "x",
      "content": "x"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', function () { pm.expect(pm.response.code).to.be.oneOf([403]); });
    language: text/javascript
order: 5000
