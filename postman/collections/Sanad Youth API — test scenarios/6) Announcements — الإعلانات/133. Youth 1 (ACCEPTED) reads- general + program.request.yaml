$kind: http-request
name: "133. Youth 1 (ACCEPTED) reads: general + program"
url: "{{base}}/announcements?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("sees the program announcement", function () { pm.expect(json.data.some(a => a.title === 'Room changed')).to.be.true; });
      pm.test("sees the general one", function () { pm.expect(json.data.some(a => a.title === 'Welcome to Sanad')).to.be.true; });
    language: text/javascript
order: 8000
