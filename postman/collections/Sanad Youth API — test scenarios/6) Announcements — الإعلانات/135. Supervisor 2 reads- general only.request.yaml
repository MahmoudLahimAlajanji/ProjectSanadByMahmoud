$kind: http-request
name: "135. Supervisor 2 reads: general only"
url: "{{base}}/announcements"
method: GET
headers:
  Authorization: Bearer {{sup2_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("no program announcements", function () { pm.expect(json.data.every(a => a.program === null)).to.be.true; });
    language: text/javascript
order: 10000
