$kind: http-request
url: "{{base}}/announcements"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("edited content", function () { pm.expect(json.data.find(a => a.title === 'Room changed').content).to.include('Hall 4'); });
    language: text/javascript
order: 13000
