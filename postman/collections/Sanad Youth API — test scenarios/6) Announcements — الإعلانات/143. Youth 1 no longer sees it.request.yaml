$kind: http-request
url: "{{base}}/announcements"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("gone", function () { pm.expect(json.data.some(a => a.title === 'Room changed')).to.be.false; });
    language: text/javascript
order: 18000
