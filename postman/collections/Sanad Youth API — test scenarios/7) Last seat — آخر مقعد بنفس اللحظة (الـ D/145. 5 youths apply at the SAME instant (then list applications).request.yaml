$kind: http-request
description: 'المتوقع: واحد 201 والباقي 409 "No seats left". ما بيصير تسجيل زيادة أبدًا.'
url: "{{base}}/applications?programId={{lastProgramId}}&status=PENDING"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
queryParams:
  programId: "{{lastProgramId}}"
  status: PENDING
scripts:
  - type: beforeRequest
    code: |-
      const base = pm.collectionVariables.get('base');
      const pid = pm.collectionVariables.get('lastProgramId');
      const users = [1,2,3,4,5].map(i => ({ label: 'youth' + i, token: 'y' + i + '_token' }));
      const fire = (u) => new Promise((resolve) => pm.sendRequest({
        url: base + '/applications',
        method: 'POST',
        header: { Authorization: 'Bearer ' + pm.collectionVariables.get(u.token) },
        body: { mode: 'urlencoded', urlencoded: [{ key: 'programId', value: String(pid) }] },
      }, (err, res) => {
        let body = {}; try { body = res.json(); } catch (e) {}
        resolve({ who: u.label, code: res ? res.code : 'ERR', msg: body.message || body.status || String(err || '') });
      }));
      Promise.all(users.map(fire)).then((results) => {
        console.log(results.map(r => r.who + ' -> ' + r.code + ' ' + r.msg).join('\n'));
        pm.collectionVariables.set('winners', results.filter(r => r.code === 201).length);
        pm.collectionVariables.set('winnerslost', results.filter(r => r.code === 409).length);
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("exactly ONE application got the seat", function () { pm.expect(pm.collectionVariables.get('winners')).to.eql(1); });
      pm.test("the other 4 got a clear 409", function () { pm.expect(pm.collectionVariables.get('winnerslost')).to.eql(4); });
      pm.test("only 1 application stored", function () { pm.expect(json.meta.total).to.eql(1); });
    language: text/javascript
order: 2000
