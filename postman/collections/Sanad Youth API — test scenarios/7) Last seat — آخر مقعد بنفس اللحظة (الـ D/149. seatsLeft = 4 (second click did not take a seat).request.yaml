$kind: http-request
url: "{{base}}/programs/{{dupProgramId}}"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("seatsLeft is 4", function () { pm.expect(json.seatsLeft).to.eql(4); });
    language: text/javascript
order: 6000
