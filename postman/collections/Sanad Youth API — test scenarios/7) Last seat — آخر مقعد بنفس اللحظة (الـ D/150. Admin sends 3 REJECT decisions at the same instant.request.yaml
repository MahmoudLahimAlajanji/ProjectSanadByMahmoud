$kind: http-request
description: لو القرار انطبق مرتين المقاعد كانت تصير أكتر من العدد الأصلي.
url: "{{base}}/programs/{{dupProgramId}}"
method: GET
headers:
  Authorization: Bearer {{y1_token}}
scripts:
  - type: beforeRequest
    code: |-
      const base = pm.collectionVariables.get('base');
      const id = pm.collectionVariables.get('dupAppId');
      const fire = (n) => new Promise((resolve) => pm.sendRequest({
        url: base + '/applications/' + id + '/decision',
        method: 'PATCH',
        header: { Authorization: 'Bearer ' + pm.collectionVariables.get('admin_token'), 'Content-Type': 'application/json' },
        body: { mode: 'raw', raw: JSON.stringify({ status: 'REJECTED' }) },
      }, (err, res) => resolve(res ? res.code : 'ERR')));
      Promise.all([1, 2, 3].map(fire)).then((codes) => {
        console.log('decision codes: ' + codes.join(', '));
        pm.collectionVariables.set('decideOk', codes.filter(c => c === 200).length);
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      let json = {}; try { json = pm.response.json(); } catch (e) {}
      pm.test("only one decision applied", function () { pm.expect(pm.collectionVariables.get('decideOk')).to.eql(1); });
      pm.test("seat returned ONCE (5 of 5, not 7)", function () { pm.expect(json.seatsLeft).to.eql(5); });
    language: text/javascript
order: 7000
